(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],E=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),H=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0},P=(a,n)=>a[n%a.length],S={screen:'home',step:0,kind:'founder',roll:0,branch:[],profile:{name:'',age:'',path:'',dream:'',obsession:'',chaos:82}},fields=[['name','What should the multiverse call you?','Rishi'],['age','How old is this version of you?','21'],['path','What path are you currently on?','Computer science student'],['dream','What would you chase if failure had no power?','Build something impossible'],['obsession','What lives in your head at 3:17 AM?','AI, games, strange ideas']];try{Object.assign(S.profile,JSON.parse(localStorage.dv||'{}'))}catch{}
const worlds=()=>{let p=S.profile,seed=H(Object.values(p).join('|')+'|'+S.roll),cities=['Bengaluru','Singapore','Reykjavík','Tokyo','Lisbon','Neo-Seoul'],companies=['MythOS','Astra Forge','Dreamframe','Parallax Labs','Velvet Signal'],alts=['film director','game designer','architect','quant researcher','music producer','venture builder'],powers=['Pattern sight','Impossible timing','Narrative gravity','Calm under chaos','Magnetic conviction'],relics=['a cracked obsidian ring','a brass key with no lock','a notebook dated tomorrow','a silver coin from 2050','a glass card that remembers'],stat=o=>56+(((seed>>>(o%13))+o*19)%43),now=new Date().getFullYear(),base=(kind,label,icon,year,role,loc,power,relic,title,story,events)=>({kind,label,icon,year,role,loc,power,relic,title,story,stats:[stat(2),stat(5),stat(8),stat(11)],events});return[
base('founder','Founder reality','♜',now+6,`Founder · ${P(companies,seed)}`,P(cities,seed),P(powers,seed+1),P(relics,seed+3),`${E(p.name||'You')} built the company everyone said was too weird.`,`You stopped asking whether the idea was realistic. ${E(p.dream||'The impossible thing')} became a product, then a movement. Your obsession with ${E(p.obsession||'strange ideas')} became the unfair advantage.`,[[now+1,'The reckless prototype','You ship the version that embarrasses sensible people.'],[now+3,'The room changes','A tiny cult following turns into real momentum.'],[now+6,'Myth becomes infrastructure','Your weird idea becomes somebody else’s normal.']]),
base('future','2050 reality','◈',2050,'Reality Systems Architect',P(cities,seed+4),P(powers,seed+5),P(relics,seed+7),'In 2050, your job did not exist when you were born.',`The world automated the obvious work. You became valuable for the thing machines could not standardize: the way you connect ${E(p.path||'technology')} with human imagination.`,[[2031,'You stop optimizing for approval','Your career bends sharply toward curiosity.'],[2040,'The impossible discipline appears','A field emerges around work you were already doing.'],[2050,'You design realities','People hire you to make futures feel inevitable.']]),
base('alternate','The path not taken','✧',now+8,P(alts,seed+9),P(cities,seed+10),P(powers,seed+11),P(relics,seed+13),'You chose the door you keep pretending you never saw.',`One ordinary Tuesday you abandon the safe script. The skills from ${E(p.path||'your old life')} survive the jump, but the identity does not. Somehow, that is exactly the point.`,[[now+1,'The resignation nobody understands','You trade certainty for a story worth telling.'],[now+4,'Talent catches up to obsession','The amateur phase ends without permission.'],[now+8,'Your second name becomes a genre','People describe new work by comparing it to yours.']]),
base('cyber','Restricted timeline','⌁','21██','Memory Smuggler · Class VII','NEON DISTRICT 09',P(powers,seed+15),P(relics,seed+17),'This reality has been trying to delete you for six years.',`In a city where identities are licensed, you keep illegal versions of people alive. Your file lists one dangerous trait: “cannot distinguish delusion from prophecy.” The authorities may have a point.`,[['03:17','The signal repeats','Your name appears inside a broadcast from tomorrow.'],['04:02','You steal yourself','A forbidden archive contains 47 alternate versions of you.'],['SUNRISE','The city blinks first','You release the archive and reality becomes contagious.']])];};
const nav=()=>`<div class="wrap nav"><button class="brand" data-a="home"><span class="sig">✦</span>DELULUVERSE</button><span class="status"><i></i>REALITY ENGINE ONLINE</span></div>`;
function home(){return nav()+`<main class="wrap hero"><section><div class="eyebrow">PARALLEL UNIVERSE IDENTITY ENGINE · V1</div><h1>Somewhere, another<br><em>you already did it.</em></h1><p>Tell us who you are in this timeline. We’ll fracture the facts, disturb the probability field, and show you the lives that got away.</p><div class="actions"><button class="primary" data-a="start">Enter the rift →</button><button class="ghost" data-a="demo">Use a chaotic demo ⚄</button></div><div class="realms"><div class="mini"><span>♜</span><b>Founder you</b><small>AMBITION TIMELINE</small></div><div class="mini"><span>◈</span><b>You · 2050</b><small>FUTURE SIGNAL</small></div><div class="mini"><span>✧</span><b>Other career</b><small>THE DOOR MISSED</small></div><div class="mini"><span>⌁</span><b>Cyberpunk you</b><small>RESTRICTED REALITY</small></div></div></section></main>`}
function calibrate(){if(S.step<5){let f=fields[S.step],v=S.profile[f[0]],pct=(S.step/5)*100;return nav()+`<main class="wrap cal"><section class="card"><div class="progress"><i style="width:${pct}%"></i></div><span class="qnum">0${S.step+1} / 05 · REALITY CALIBRATION</span><h2>${f[1]}</h2><input class="answer" id="ans" ${f[0]=='age'?'type="number" min="13" max="99"':'type="text"'} value="${E(v)}" placeholder="${f[2]}" autofocus><p class="hint">Stored only in this browser. The multiverse is nosy; we are not.</p><div class="row"><button class="ghost" data-a="prev" ${S.step?'':'disabled'}>← Back</button><button class="primary" data-a="next" ${String(v).trim()?'':'disabled'}>Continue →</button></div></section></main>`}return nav()+`<main class="wrap cal"><section class="card"><div class="progress"><i style="width:100%"></i></div><span class="qnum">FINAL CALIBRATION</span><h2>How dangerous should your alternate selves be?</h2><div class="chaos"><b id="cv">${S.profile.chaos}</b><span>% DELULU</span></div><input id="range" class="range" type="range" min="1" max="100" value="${S.profile.chaos}"><p class="hint">reasonable human ← main character → cosmic liability</p><div class="row"><button class="ghost" data-a="prev">← Back</button><button class="primary" data-a="fracture">✦ Fracture reality</button></div></section></main>`}
function branch(){if(S.branch.length>=3){let endings=[['The Beautiful Catastrophe','Every sensible prediction failed. You became impossible to model — which turned out to be your strongest asset.'],['The Quiet Empire','You stopped performing ambition and built something undeniable in private.'],['The Glitch That Won','Reality tried to correct you. It ran out of patches.'],['The Main Character Incident','Against statistical advice, the ridiculous plan worked.']][H(S.branch.join('|'))%4];return`<div class="ending"><span class="kicker">BRANCH STABILIZED</span><div class="star">✦</div><h3>${endings[0]}</h3><p class="story">${endings[1]}</p><button class="primary" data-a="branchReset">Disturb reality again ⚄</button></div>`}let qs=[['A mysterious investor offers absurd money, but wants control.',['Take the money','Stay feral','Counter with something insane']],['Your safest opportunity collides with your dream.',['Choose safety','Choose the dream','Attempt both somehow']],['A future version of you sends one warning.',['Obey it','Ignore it','Send a warning back']]],q=qs[S.branch.length];return`<span class="kicker">DECISION ${S.branch.length+1} OF 3</span><h3>${q[0]}</h3><div class="choicegrid">${q[1].map(x=>`<button class="choice" data-c="${encodeURIComponent(x)}">${x} →</button>`).join('')}</div>`}
function portal(){let ws=worlds(),w=ws.find(x=>x.kind===S.kind)||ws[0],names=['Influence','Wealth','Freedom','Chaos'];return nav()+`<main class="wrap portal"><div class="topline"><div><span class="pill">● MULTIVERSE STABLE</span><span class="subject">SUBJECT ${E(S.profile.name||'UNKNOWN')} · ROLL ${S.roll}</span></div><div class="tools"><button data-a="copy" title="Copy">⧉</button><button data-a="reroll" title="Reroll">↻</button><button data-a="reset" title="Change identity">⌁</button></div></div><section class="hello"><span class="kicker">IDENTITY FRACTURE COMPLETE</span><h1>Welcome back, ${E(S.profile.name||'traveler')}.</h1><p>Four plausible impossibilities survived the fracture. None are predictions. All are invitations.</p></section><div class="orbit"><div class="you">YOU</div><span class="orb o1">♜</span><span class="orb o2">◈</span><span class="orb o3">✧</span><span class="orb o4">⌁</span></div><div class="tabs">${ws.map(x=>`<button class="tab ${x.kind===S.kind?'active':''}" data-k="${x.kind}"><span>${x.icon}</span><b>${x.label}</b><small>${x.year}</small></button>`).join('')}</div><section class="reality" style="--glow:${w.kind==='cyber'?'#00d8ff20':w.kind==='future'?'#55e4c720':w.kind==='alternate'?'#e5a55720':'#9c5cff25'}"><span class="meta">${w.year} · ${E(w.loc)} · ${E(w.role)}</span><h2>${w.title}</h2><p class="story">${w.story}</p><div class="chips"><span>POWER · ${E(w.power)}</span><span>RELIC · ${E(w.relic)}</span><span>RISK · ${S.profile.chaos}%</span></div><div class="metrics">${w.stats.map((n,i)=>`<div class="metric"><strong>${n}</strong><small>${names[i]}</small></div>`).join('')}</div><div class="timeline"><span class="kicker">TIMELINE ECHOES</span>${w.events.map(e=>`<div class="event"><time>${e[0]}</time><i class="dot"></i><div><b>${e[1]}</b><p>${e[2]}</p></div></div>`).join('')}</div></section><section class="branch"><span class="kicker">LIVE BRANCH EXPERIMENT</span><h3>Make one bad decision. See what reality does with it.</h3><div id="branch">${branch()}</div></section><footer class="footer"><div><strong>✦ DELULUVERSE</strong><p>Made for people whose Plan B is another universe.</p></div><button class="ghost" data-a="copy">Copy this reality ⧉</button></footer></main>`}
function save(){try{localStorage.dv=JSON.stringify(S.profile)}catch{}}function render(){app.innerHTML=S.screen==='home'?home():S.screen==='cal'?calibrate():portal();bind()}function bind(){let ans=$('#ans');if(ans)ans.oninput=e=>{S.profile[fields[S.step][0]]=e.target.value;let b=$('[data-a=next]');if(b)b.disabled=!e.target.value.trim()};let r=$('#range');if(r)r.oninput=e=>{S.profile.chaos=+e.target.value;$('#cv').textContent=e.target.value};$$('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));$$('[data-k]').forEach(b=>b.onclick=()=>{S.kind=b.dataset.k;render()});$$('[data-c]').forEach(b=>b.onclick=()=>{S.branch.push(decodeURIComponent(b.dataset.c));render()})}async function act(a){if(a==='home'){S.screen='home';S.step=0}if(a==='start'){S.screen='cal';S.step=0}if(a==='demo'){S.profile={name:'Rishi',age:'21',path:'Computer science student building weird internet things',dream:'Build products people remember',obsession:'AI, games, cinematic interfaces and impossible ideas',chaos:94};S.screen='cal';S.step=0}if(a==='next'){if(S.step<5)S.step++}if(a==='prev'){S.step=Math.max(0,S.step-1)}if(a==='fracture'){save();S.screen='portal';S.kind='founder';S.branch=[]}if(a==='reroll'){S.roll++;S.branch=[]}if(a==='reset'){S.screen='cal';S.step=0}if(a==='branchReset')S.branch=[];if(a==='copy'){let w=worlds().find(x=>x.kind===S.kind);try{await navigator.clipboard.writeText(`DeluluVerse — ${w.label}\n${w.title}\n${w.story}`)}catch{}}render()}render()})();
</script></body></html>
